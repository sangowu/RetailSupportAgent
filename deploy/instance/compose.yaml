# The demo stack as it runs on the instance.
#
# The repository root's compose.yaml is the development one: it builds the image from
# source and binds to the loopback address. This one pulls a published image and listens on
# every interface, because the machine it runs on is the boundary. tests/test_deploy_files.py
# checks the two describe the same services, so they cannot drift apart unnoticed.
#
# DASHSCOPE_API_KEY comes from /opt/rsa/.env, written at boot from Parameter Store by
# rsa-start. It has no default: a stack that starts without a key and fails on the first
# message is worse than one that refuses to start.
#
# This file ships inside the image and is extracted from it at boot (M6.8), so the copy on
# the instance always describes the version that is running. Editing the copy in /opt/rsa
# has no lasting effect: the next start overwrites it.
#
# Only Caddy publishes ports. The API and the UI are reachable on the compose network and
# nowhere else, so the write routes cannot be called from outside at all.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rsa
      POSTGRES_PASSWORD: rsa_local_dev
      POSTGRES_DB: rsa
    volumes:
      - rsa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsa -d rsa"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: ${RSA_IMAGE:?RSA_IMAGE is required}
    command: ["migrate"]
    environment:
      RSA_DATABASE_URL: postgresql+psycopg://rsa:rsa_local_dev@db:5432/rsa
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?set DASHSCOPE_API_KEY in the environment}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  # Which token subject is which retail identity, and which roles it holds. Terraform
  # knows the subjects and the database does not, so the mapping arrives in the
  # environment and this writes it before anything can authenticate against it. Idempotent,
  # so it repairs a reset volume without an apply.
  seed:
    image: ${RSA_IMAGE:?RSA_IMAGE is required}
    command: ["seed"]
    environment:
      RSA_DATABASE_URL: postgresql+psycopg://rsa:rsa_local_dev@db:5432/rsa
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?set DASHSCOPE_API_KEY in the environment}
      RSA_IDENTITIES: ${RSA_IDENTITIES:-}
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: "no"

  api:
    image: ${RSA_IMAGE:?RSA_IMAGE is required}
    command: ["api"]
    environment:
      - RSA_DATABASE_URL=postgresql+psycopg://rsa:rsa_local_dev@db:5432/rsa
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:?set DASHSCOPE_API_KEY in the environment}
      # Both set here, so every route requires a verified token. The issuer names the
      # pool and the audience names the app client; neither is a secret, and neither
      # opens anything on its own.
      - RSA_AUTH_ISSUER=${RSA_AUTH_ISSUER:?RSA_AUTH_ISSUER is required}
      - RSA_AUTH_AUDIENCE=${RSA_AUTH_AUDIENCE:?RSA_AUTH_AUDIENCE is required}
      # Reported by /health. A rollback is only checkable if the running version can be
      # read from the thing that is running (M6.8).
      - RSA_IMAGE=${RSA_IMAGE:?RSA_IMAGE is required}
      # Settings a deployment may need to change, passed through only when the
      # environment sets one. A bare name resolves from the shell or from the project
      # `.env`; unset, compose leaves it out of the container entirely, so the
      # application's own default stays the single source of truth and this file never
      # holds a second copy of it to drift from.
      #
      # They are listed because nothing else would carry them: this file names every
      # variable the service is given, so a setting absent here is one the deployment
      # cannot set at all. `RSA_APPROVAL_TTL_SECONDS` was documented as configurable
      # and reachable nowhere but a developer's own machine.
      - RSA_APPROVAL_TTL_SECONDS
      - RSA_SESSION_CACHE_SIZE
      - RSA_SCOPE_REDACT_FIELDS
      - RSA_SCOPE_WRITE_STATUSES
      - RSA_SCOPE_CHECK_OUTPUT
      - RSA_AUTH_JWKS_URL
      - RSA_AUTH_TOKEN_USE
      - RSA_OPENAI_BASE_URL
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 3s
      timeout: 5s
      retries: 40

  ui:
    image: ${RSA_IMAGE:?RSA_IMAGE is required}
    command: ["ui"]
    environment:
      RSA_DATABASE_URL: postgresql+psycopg://rsa:rsa_local_dev@db:5432/rsa
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?set DASHSCOPE_API_KEY in the environment}
      RSA_UI_HOST: "0.0.0.0"
      # The UI signs the visitor in and then calls the API as them. It reaches the API on
      # the compose network, so /chat stays unroutable from the internet.
      RSA_API_URL: http://api:8000
      RSA_COGNITO_REGION: ${RSA_COGNITO_REGION:?RSA_COGNITO_REGION is required}
      RSA_COGNITO_CLIENT_ID: ${RSA_COGNITO_CLIENT_ID:?RSA_COGNITO_CLIENT_ID is required}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      seed: {condition: service_completed_successfully}
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7860/', timeout=3).status==200 else 1)\""]
      interval: 3s
      timeout: 5s
      retries: 40

  # Terminates TLS on a name that follows this machine's changing address, and exposes
  # less than what runs: the UI, plus /health and /idle for the operator.
  caddy:
    image: caddy:2-alpine
    environment:
      RSA_DOMAIN: ${RSA_DOMAIN:?RSA_DOMAIN is required}
      RSA_ACME_EMAIL: ${RSA_ACME_EMAIL:?RSA_ACME_EMAIL is required}
    ports:
      # 80 has to be open to the internet for the HTTP-01 challenge. What answers there is
      # a redirect and the challenge responder; 443 is what the security group restricts.
      - "80:80"
      - "443:443"
    volumes:
      - /opt/rsa/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates on the host, so they survive a stop, a start and this container being
      # replaced. Reissuing on every start would meet Let's Encrypt's rate limit quickly.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
      ui: {condition: service_healthy}
    healthcheck:
      # Caddy's own admin API, not the site it serves.
      #
      # Asking the site on :80 gets a redirect to https, and wget follows it into a TLS
      # handshake against an IP address, for which there is no certificate and never will
      # be. That handshake fails, the container never reports healthy, `compose up --wait`
      # gives up after 150s, and rsa.service reports a failure while the demo answers
      # perfectly. It had been doing that on every boot since M6.6 and was found in M6.8,
      # because `demo.py restart` is the first thing that reads the unit's result.
      #
      # Whether the proxy actually serves the site is checked from outside by
      # scripts/demo.py, which is where that question can be answered honestly.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  rsa_pgdata:
  caddy_data:
  caddy_config:

[project]
name = "retail-support-agent"
version = "0.0.0"
description = "Retail support agent: order lookup / cancellation / return, with business correctness proven by reproducible evaluation"
readme = "README.md"
# Pinned to 3.12: upstream tau2 declares support for <3.14, but its import chain pulls in
# audioop, removed in 3.13 (PEP 594), so 3.13 raises ModuleNotFoundError immediately.
# See docs/M0.3_BUSINESS_LOOP.md.
requires-python = ">=3.12,<3.13"
# From M0.3 these are required at runtime and are no longer deferred into a group.
# Langfuse belongs to the bench group: it reports traces only during evaluation, and the
# service itself does not depend on it.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.55",
    "langgraph>=0.2.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gradio>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # RS256 verification of Cognito-shaped tokens (M3). A signature check is not a
    # place for hand-written code; the algorithm allowlist and required claims are
    # passed explicitly rather than left to defaults.
    "pyjwt[crypto]>=2.10",
    # The MCP server (M9). v2 is required: `MCPServer` and `Resolve`-based elicitation
    # do not exist in v1, whose `FastMCP` class was removed.
    "mcp>=2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    # Reading the compose files in tests/test_deploy_files.py. Available transitively
    # through other packages, declared here because a test that depends on it should say so.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
# Upstream code at the same commit pinned in M0.1, with its tools and evaluators never
# rewritten. The data still comes from the SHA256-verified checkout under third_party/
# (TAU2_DATA_DIR points at it).
#
# This is a runtime dependency of the running service, not only of an evaluation:
# RetailDomain imports tau2.domains.retail.environment, so a demo that cannot import tau2
# cannot answer a question. It stays a group rather than a main dependency because it
# pulls in litellm, pandas and numpy, which a plain library install has no use for.
demo = [
    "tau2",
]
# Evaluation is the demo's dependencies plus tracing. Langfuse reports traces during an
# evaluation run; the service itself never calls it.
bench = [
    { include-group = "demo" },
    "langfuse>=4.15.1",
]

[tool.uv.sources]
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "fc0055dc4e0a316c3f83133267fbd6faaa770992" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_support_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
strict = true
warn_unreachable = true

# Upstream tau2 ships no py.typed, so it is treated as an external untyped library
[[tool.mypy.overrides]]
module = ["tau2.*"]
ignore_missing_imports = true

# litellm and opentelemetry are in the bench group, which CI's `uv sync --locked` does not
# install.
# ignore_missing_imports alone is not enough: a machine with them installed reads the real
# types while one without reads Any, so the same `# type: ignore` is required locally and
# reported as an unused ignore in CI.
# follow_imports = "skip" makes both sides treat them as untyped, so a local `uv run mypy`
# is strictly equivalent to CI.
[[tool.mypy.overrides]]
module = ["litellm.*", "opentelemetry.*"]
follow_imports = "skip"
ignore_missing_imports = true

# gradio's bundled type annotations disagree with its runtime (Button.click exists but is
# not annotated), so its type information is skipped rather than scattering type: ignore
# comments through this project to accommodate upstream annotations
[[tool.mypy.overrides]]
module = ["gradio.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "live_model: needs a real model API and billing; not run in CI by default (used from M0.2)",
]

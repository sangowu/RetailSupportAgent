[project]
name = "retail-support-agent"
version = "0.0.0"
description = "零售客服 Agent：订单查询 / 取消订单 / 退货申请，以可复现评测证明业务正确性"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

# 依赖按里程碑分组，M0.1 只需 dev，避免早期 CI 拉入 UI/模型栈。
[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
agent = [
    "openai>=1.55",
    "langgraph>=0.2.50",
    "langfuse>=2.53",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
ui = [
    "gradio>=5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_support_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]
# 本项目文档与断言消息使用中文，全角标点属预期，不按"易混淆字符"处理
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "live_model: 需要真实模型 API 与计费，默认不在 CI 运行（M0.2 起使用）",
]

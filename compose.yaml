# PostgreSQL for local development. It listens on the loopback address only: nothing
# outside this machine can connect.
#
# The password is written here deliberately. It is the password of a local development
# database, not a credential of any real environment, and moving it into .env would make
# "which database am I connected to" less obvious. Real connection strings go through the
# RSA_DATABASE_URL environment variable and never enter Git.
services:
  db:
    image: postgres:17-alpine
    container_name: rsa-postgres
    environment:
      POSTGRES_USER: rsa
      POSTGRES_PASSWORD: rsa_local_dev
      POSTGRES_DB: rsa
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - rsa_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without a healthcheck, "the service started" and "the service accepts connections"
      # are two different things, and migrations fail at random in the first seconds after
      # the container starts.
      test: ["CMD-SHELL", "pg_isready -U rsa -d rsa"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  rsa_pgdata:

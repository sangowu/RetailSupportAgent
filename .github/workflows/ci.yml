name: CI

# CI 做静态检查、单元测试、上游固定校验，以及基线完整性校验。
# **CI 不跑评测**：跑一轮要真实计费。门禁只校验基线没被改过，不产生任何新数值。
# 需要真实模型调用的探针不进 CI（标记 live_model），避免 CI 产生计费。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 同步依赖（项目 + dev；bench 组含上游重依赖，仅评测作业需要）
        run: uv sync --locked

      - name: Ruff 格式
        run: uv run ruff format --check .

      - name: Ruff 静态检查
        run: uv run ruff check .

      - name: mypy 类型检查
        run: uv run mypy

      - name: pytest（不含需要真实模型计费的用例）
        run: uv run pytest -m "not live_model"

  upstream-pin:
    name: 上游基准固定校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: 按固定 commit 拉取 τ²-bench 并逐文件校验 SHA256
        run: uv run python scripts/fetch_tau2.py

  evaluation-gate:
    name: 评测门禁（基线完整性）
    runs-on: ubuntu-latest
    needs: [static-and-unit, upstream-pin]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      # 本作业**不跑评测**：跑一轮要真实计费，CI 里跑不起也不该跑。
      # 它守的是基线本身没被悄悄改过——任务集、上游 manifest、那一轮的 summary
      # 任何一个变了，基线就不再代表它自称的那次运行，后续对比也就失去意义。
      - name: 校验 baseline-v1 的校验和
        run: uv run python scripts/freeze_baseline.py --verify

      - name: 说明本作业不产生成绩数值
        run: |
          echo "::notice title=评测门禁::已校验 baseline-v1 完整性。"
          echo "本作业不运行评测、不产生任何成功率或延迟数值——出现新数字即为造假。"
          echo "基线成绩见 evaluation/baselines/baseline-v1/baseline.json，规范见 docs/EVALUATION_AND_GATES.md。"

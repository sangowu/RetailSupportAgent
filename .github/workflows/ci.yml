name: CI

# CI runs static checks, unit tests, the upstream pin verification, and the baseline
# integrity check.
# CI does not run evaluations: one run costs real money. The gate only verifies that the
# baselines are unaltered and produces no new numbers.
# Probes that need real model calls stay out of CI (marked live_model) so CI is never
# billed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: static checks and unit tests
    runs-on: ubuntu-latest

    # The M1 persistence tests need a real PostgreSQL: partial unique indexes, unique
    # conflicts and transaction rollback are dialect-specific, and a green run on SQLite
    # would show nothing. Without this service those tests skip silently, and a skip
    # looks identical to a pass in the summary line.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rsa
          POSTGRES_PASSWORD: rsa_ci
          POSTGRES_DB: rsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa -d rsa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RSA_TEST_DATABASE_URL: postgresql+psycopg://rsa:rsa_ci@localhost:5432/rsa_test

    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # API and streaming tests construct the real retail domain even when model
      # responses are faked. Install its dependencies and verified data so this job
      # runs the full suite rather than failing or silently skipping domain tests.
      # Installing bench dependencies does not run a billed evaluation.
      - name: sync dependencies (project, dev and bench for the full test suite)
        run: uv sync --locked --group bench

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      - name: fetch and verify the pinned retail data for the full test suite
        run: uv run python scripts/fetch_tau2.py

      - name: pytest (excluding tests that need billed model calls)
        run: uv run pytest -m "not live_model"

      # The M9 acceptance table, measured: ten scenarios against the MCP server over
      # real HTTP, in the 2026-07-28 and the legacy protocol. pytest above already fails
      # the build if one breaks; this keeps the numbers of every run as an artifact.
      # No model is called.
      - name: MCP acceptance report
        run: uv run python scripts/run_mcp_acceptance.py --out reports/mcp_acceptance/ci.json

      - name: keep the MCP acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-acceptance
          path: reports/mcp_acceptance/ci.json
          if-no-files-found: warn

  upstream-pin:
    name: upstream benchmark pin and domain replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: fetch the pinned commit and verify every file's SHA256
        run: uv run python scripts/fetch_tau2.py

      # Keep this focused replay check independent of the full test job so upstream
      # pin integrity and domain replay remain separately visible gates.
      - name: install the bench group for the domain replay tests
        run: uv sync --locked --group bench

      - name: verify a replayed session reproduces the same database
        run: uv run pytest tests/test_recovery.py -k TestReplayReproducesTheRealDatabase

  evaluation-gate:
    name: evaluation gate (baseline integrity)
    runs-on: ubuntu-latest
    needs: [static-and-unit, upstream-pin]
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      # This job does not run an evaluation: one run costs real money, and CI neither
      # can nor should. It guards that the baselines themselves were not altered. If the
      # task sets, the upstream manifest or a run's summary change, a baseline no longer
      # represents the run it claims and every later comparison loses its meaning.
      - name: verify the baseline checksums
        run: uv run python scripts/freeze_baseline.py --verify

      - name: state that this job produces no scores
        run: |
          echo "::notice title=evaluation gate::baseline integrity verified."
          echo "This job runs no evaluation and produces no success-rate or latency numbers; a new number here would be fabricated."
          echo "Baseline records are in evaluation/baselines/, and the rules are in docs/EVALUATION_AND_GATES.md."
